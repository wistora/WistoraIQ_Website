<!doctype html>
<html lang="en">

<head>

    <!-- ========================================
         META INFORMATION
    ======================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Gallery | Wistora IQ Solutions</title>

    <link
        rel="icon"
        href="favicon.png"
    >


    <!-- ========================================
         GOOGLE FONT
    ======================================== -->

    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    >


    <!-- ========================================
         CSS
    ======================================== -->

    <style>

        /* ========================================
           ROOT VARIABLES
        ======================================== */

        :root {
            --navy: #0B0E2E;
            --cyan: #4FE3F0;
            --secondary: #5B6478;
            --text: #111431;
            --background: #F5F8FB;
            --border: #E1E5ED;
            --accent: #149BB5;
            --white: #FFFFFF;
        }


        /* ========================================
           GLOBAL STYLES
        ======================================== */

        * {
            box-sizing: border-box;

            margin: 0;
            padding: 0;
        }


        body {
            font-family: "Inter", sans-serif;

            background: var(--background);

            color: var(--text);
        }


        a {
            color: inherit;

            text-decoration: none;
        }


        /* ========================================
           NAVIGATION
        ======================================== */

        .nav {
            position: fixed;

            top: 0;
            left: 0;
            right: 0;

            z-index: 10;

            display: flex;

            align-items: center;
            justify-content: space-between;

            padding: 18px 32px;

            background: rgba(11, 14, 46, 0.82);

            backdrop-filter: blur(14px);

            color: var(--white);
        }


        /* ----------------------------------------
           BRAND
        ---------------------------------------- */

        .nav-brand {
            display: flex;

            align-items: center;

            gap: 10px;
        }


        .nav-brand img {
            height: 34px;
        }


        .nav-brand span {
            display: block;

            font-weight: 600;

            font-size: 15px;
        }


        .nav-brand small {
            display: block;

            color: var(--cyan);

            font-size: 9px;

            letter-spacing: 0.1em;

            text-transform: uppercase;
        }


        /* ----------------------------------------
           NAVIGATION LINKS
        ---------------------------------------- */

        .nav-links {
            display: flex;

            align-items: center;

            gap: 34px;
        }


        .nav-links > a,
        .nav-more-toggle {
            font-family: "Inter", sans-serif;

            font-size: 13.5px;

            font-weight: 500;

            color: rgba(255, 255, 255, 0.78);

            padding: 4px 0;
        }


        /* ========================================
           MORE DROPDOWN
        ======================================== */

        .nav-more {
            position: relative;
        }


        .nav-more-toggle {
            background: none;

            border: none;

            color: var(--white);

            cursor: pointer;
        }


        .nav-more-toggle::after {
            content: " ▾";

            color: var(--cyan);

            font-size: 10px;
        }


        .nav-more-menu {
            position: absolute;

            top: 32px;
            left: -16px;

            min-width: 165px;

            padding: 9px;

            list-style: none;

            background: var(--navy);

            border: 1px solid rgba(79, 227, 240, 0.3);

            border-radius: 10px;

            opacity: 0;

            visibility: hidden;

            transform: translateY(6px);

            transition: 0.2s;
        }


        .nav-more-menu a {
            display: block;

            padding: 9px 10px;
        }


        .nav-more:hover .nav-more-menu,
        .nav-more:focus-within .nav-more-menu {
            opacity: 1;

            visibility: visible;

            transform: none;
        }


        /* ========================================
           MOBILE MENU BUTTON
        ======================================== */

        .nav-toggle {
            display: none;

            flex-direction: column;

            gap: 5px;

            background: none;

            border: none;
        }


        .nav-toggle span {
            width: 22px;

            height: 2px;

            background: var(--white);
        }


        /* ========================================
           MAIN CONTENT
        ======================================== */

        .wrap {
            max-width: 1050px;

            margin: auto;

            padding: 140px 25px 80px;
        }


        /* ========================================
           HERO SECTION
        ======================================== */

        .eyebrow {
            color: var(--accent);

            font-size: 12px;

            letter-spacing: 0.12em;

            text-transform: uppercase;
        }


        .hero h1 {
            font-size: clamp(38px, 6vw, 70px);

            margin: 14px 0;
        }


        .hero p {
            max-width: 620px;

            color: var(--secondary);

            line-height: 1.7;
        }

        .hero {
            animation: galleryHeroIn 0.85s cubic-bezier(.22,.9,.31,1) both;
        }

        .hero h1 {
            animation: galleryTitleIn 0.8s cubic-bezier(.22,.9,.31,1) 0.1s both;
        }

        .hero p {
            animation: galleryCopyIn 0.8s cubic-bezier(.22,.9,.31,1) 0.22s both;
        }


        /* ========================================
           GALLERY GRID
        ======================================== */

        .gallery {
            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 18px;

            margin-top: 42px;
        }

        .gallery-section + .gallery-section {
            margin-top: 56px;
        }

        .gallery-section {
            position: relative;
            animation: sectionIn 0.8s cubic-bezier(.22,.9,.31,1) both;
        }

        .gallery-section:nth-of-type(2) {
            animation-delay: 0.18s;
        }

        .gallery-section:nth-of-type(3) {
            animation-delay: 0.32s;
        }

        .gallery-section h2 {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text);
            font-size: 30px;
        }

        .gallery-section h2::before {
            content: "";
            display: block;
            width: 38px;
            height: 4px;
            border-radius: 4px;
            background: var(--cyan);
        }

        .gallery-section .gallery {
            margin-top: 20px;
        }


        /* ========================================
           GALLERY IMAGES
        ======================================== */

        .gallery img {
            display: block;
            width: 100%;

            aspect-ratio: 4 / 3;

            object-fit: contain;

            padding: 25px;

            background: var(--white);

            border: 1px solid var(--border);

            border-radius: 12px;

            opacity: 0;
            animation: imageIn 0.7s cubic-bezier(.22,.9,.31,1) forwards;
            transition: transform 0.35s cubic-bezier(.22,.9,.31,1), box-shadow 0.35s, border-color 0.35s;
        }

        .gallery img:nth-child(1) { animation-delay: 0.12s; }
        .gallery img:nth-child(2) { animation-delay: 0.2s; }
        .gallery img:nth-child(3) { animation-delay: 0.28s; }
        .gallery img:nth-child(4) { animation-delay: 0.36s; }
        .gallery img:nth-child(5) { animation-delay: 0.44s; }
        .gallery img:nth-child(6) { animation-delay: 0.52s; }
        .gallery img:nth-child(7) { animation-delay: 0.6s; }
        .gallery img:nth-child(8) { animation-delay: 0.68s; }

        .gallery img:hover {
            transform: translateY(-8px) scale(1.02) rotate(-0.6deg);
            border-color: rgba(20, 155, 181, 0.55);
            box-shadow: 0 20px 30px -20px rgba(11, 14, 46, 0.75);
        }

        @keyframes galleryHeroIn {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes galleryTitleIn {
            from { opacity: 0; transform: translateX(-16px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes galleryCopyIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes sectionIn {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes imageIn {
            from { opacity: 0; transform: translateY(18px) scale(.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .001ms !important;
            }

            .gallery img,
            .gallery-section {
                opacity: 1;
            }
        }


        /* ========================================
           RESPONSIVE DESIGN
        ======================================== */

        /* ----------------------------------------
           TABLET
        ---------------------------------------- */

        @media (max-width: 980px) {

            .nav-links {
                display: none;
            }


            .nav-toggle {
                display: flex;
            }

        }


        /* ----------------------------------------
           MOBILE
        ---------------------------------------- */

        @media (max-width: 700px) {

            .nav {
                padding: 16px 20px;
            }


            .gallery {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>
